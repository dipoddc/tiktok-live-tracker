name: Monitor TikTok Live

# Detector: cek status live semua akun di data/config.json (maks 10),
# lalu memicu track_live.yml (per akun) dan record_live.yml (1 akun).
on:
  schedule:
    - cron: '*/5 * * * *'    # menjaga detector selalu ada yang antre/jalan
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Hanya 1 detector aktif; run baru antre dan langsung jalan saat yang lama selesai.
concurrency:
  group: tiktok-live-detector
  cancel-in-progress: false

env:
  TZ: Asia/Jakarta
  RETENTION_DAYS: '90'
  # Mode loop: detector jalan terus N menit, cek tiap SWEEP_INTERVAL_SEC.
  # Set variable repo DETECT_LOOP_MINUTES = 0 untuk mode hemat (cek sekali tiap cron).
  DETECT_LOOP_MINUTES: ${{ vars.DETECT_LOOP_MINUTES || '50' }}
  SWEEP_INTERVAL_SEC: ${{ vars.SWEEP_INTERVAL_SEC || '90' }}
  LIVE_STATUS_BRANCH: live-status

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Streamlink
        run: |
          python -m pip install --upgrade --quiet streamlink
          streamlink --version

      # ---------------- Perawatan (prune 90 hari, keepalive, hapus release lama) -------------
      - name: Prune histori > 90 hari
        run: |
          mkdir -p data/history
          CUTOFF="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          shopt -s nullglob
          for f in data/history/*_history.json; do
            jq --arg c "$CUTOFF" \
              '.sessions = ((.sessions // []) | map(select((.ended_at // .tracking_started_at // "") >= $c)))' \
              "$f" > "$f.tmp"
            if [ "$(jq '.sessions | length' "$f")" != "$(jq '.sessions | length' "$f.tmp")" ]; then
              mv "$f.tmp" "$f"; echo "Pruned: $f"
            else
              rm -f "$f.tmp"
            fi
          done

      - name: Keepalive (cegah cron dinonaktifkan GitHub)
        run: |
          LAST=$(git log -1 --format=%ct)
          if (( $(date +%s) - LAST > 45 * 86400 )); then
            date -u +%Y-%m-%dT%H:%M:%SZ > data/.keepalive
            echo "Keepalive ditulis."
          fi

      - name: Commit perawatan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore: prune histori > ${RETENTION_DAYS} hari [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Push perawatan gagal, dicoba lagi di run berikutnya."

      - name: Hapus release > 90 hari
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          gh release list --limit 500 --json tagName,createdAt \
            | jq -r --arg c "$CUTOFF" '.[] | select(((.tagName | startswith("live-")) or (.tagName | startswith("rec-"))) and .createdAt < $c) | .tagName' \
            | while read -r TAG; do
                [ -z "$TAG" ] && continue
                echo "Hapus release lama: $TAG"
                gh release delete "$TAG" --yes --cleanup-tag || true
              done

      # ---------------- Deteksi live ----------------
      - name: Deteksi live (loop)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/detector.sh
